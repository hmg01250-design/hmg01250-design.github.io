
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hassi Pool Calculator</title>
<style>
body{background:#101820;color:white;font-family:Arial;
text-align:center;padding:18px}
input{width:85%;padding:12px;margin:8px}
button{padding:12px 20px;background:#00dca0;
border:0;border-radius:8px;font-weight:bold}
#result{font-size:20px;margin-top:22px}
</style>
</head>
<body>
<h2>🎱 HASSI POOL CALCULATOR</h2>
<p>Cue ball aur target ball ke coordinates daalo</p>
<input id="x1" type="number" placeholder="Cue ball X">
<input id="y1" type="number" placeholder="Cue ball Y">
<input id="x2" type="number" placeholder="Target ball X">
<input id="y2" type="number" placeholder="Target ball Y">
<button onclick="calc()">CALCULATE SHOT</button>
<div id="result"></div>
<script>
function calc(){
let x1=+document.getElementById('x1').value;
let y1=+document.getElementById('y1').value;
let x2=+document.getElementById('x2').value;
let y2=+document.getElementById('y2').value;
if(['x1','y1','x2','y2'].some(id=>
document.getElementById(id).value.trim()==='')){
document.getElementById('result').textContent=
'Enter all four coordinates.';
return;
}
let dx=x2-x1,dy=y2-y1;
let angle=Math.atan2(dy,dx)*180/Math.PI;
let distance=Math.hypot(dx,dy);
document.getElementById('result').innerHTML=
'Angle: '+angle.toFixed(2)+'°<br>'+
'Distance: '+distance.toFixed(2)+' units';
}
</script>
</body>
</html>
